<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Film Studio - Watch Exclusive Films</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; padding-bottom: 50px; }
        header { background: #1f2833; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; }
        header h1 { font-size: 20px; color: #e50914; letter-spacing: 1px; }
        .admin-btn { background: #333; color: #fff; border: 1px solid #666; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        
        /* Film Grid */
        .film-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
        .film-card { background: #1f2833; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .film-card img { width: 100%; height: 340px; object-fit: cover; background: #111; }
        .film-info { padding: 15px; }
        .film-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .film-desc { font-size: 13px; color: #c5c6c7; margin-bottom: 12px; }
        .price-tag { font-size: 16px; color: #66fcf1; font-weight: bold; margin-bottom: 12px; }
        .buy-btn { width: 100%; background: #60bb46; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .watch-btn { width: 100%; background: #e50914; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 15px; z-index: 1000; }
        .modal-content { background: #1f2833; padding: 20px; border-radius: 10px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 15px; color: #66fcf1; font-size: 18px; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 5px; border: 1px solid #45a29e; background: #0b0c10; color: #fff; }
        .close-btn { background: #555; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; margin-top: 8px; cursor: pointer; }
        video, iframe { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🎬 AK FILM STUDIO</h1>
    <button class="admin-btn" onclick="openAdmin()">⚙️ Admin Panel</button>
</header>

<div class="container">
    <h2>Latest Releases</h2>
    <div class="film-grid" id="filmList"></div>
</div>

<!-- Admin Panel Modal -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <h2>➕ Add / Update Film & Ticket Price</h2>
        <input type="text" id="filmTitle" placeholder="Film Name (e.g. THE LOST DAYS)">
        <input type="text" id="filmPoster" placeholder="Poster Image URL (Direct link)">
        <input type="number" id="filmPrice" placeholder="Ticket Price in Rs. (e.g. 100)">
        <input type="text" id="filmVideo" placeholder="Video Embed Link (Bunny/YouTube/Drive)">
        <textarea id="filmDesc" rows="3" placeholder="Short Story / Description"></textarea>
        <button class="buy-btn" onclick="saveFilm()">Save Film</button>
        <button class="close-btn" onclick="closeModal('adminModal')">Close</button>
    </div>
</div>

<!-- eSewa Payment Modal -->
<div class="modal" id="payModal">
    <div class="modal-content">
        <h2>🟢 Pay via eSewa</h2>
        <p id="payFilmName" style="margin-bottom: 8px; font-weight: bold;"></p>
        <p id="payAmount" style="color: #60bb46; font-size: 18px; margin-bottom: 15px;"></p>
        <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">
            eSewa ID: <b>98XXXXXXXX</b> (Aafno eSewa Number rakhnus)<br>
            Payment garepaxi Transaction Code / Remarks halaunus:
        </p>
        <input type="text" id="txnCode" placeholder="Enter eSewa Transaction Code">
        <button class="buy-btn" onclick="confirmPayment()">Verify & Watch Film</button>
        <button class="close-btn" onclick="closeModal('payModal')">Cancel</button>
    </div>
</div>

<!-- Video Player Modal -->
<div class="modal" id="watchModal">
    <div class="modal-content" style="max-width: 700px;">
        <h2 id="watchTitle">Now Playing</h2>
        <div id="videoContainer"></div>
        <button class="close-btn" onclick="closeVideo()">Close Player</button>
    </div>
</div>

<script>
    // Default Sample Film
    let films = JSON.parse(localStorage.getItem('ak_films')) || [
        {
            id: 1,
            title: "THE LOST DAYS (Premiere)",
            poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500",
            price: 100,
            video: "https://www.youtube.com/embed/dQw4w9WgXcQ",
            desc: "A psychological mystery thriller by A.K Studio."
        }
    ];
    let unlocked = JSON.parse(localStorage.getItem('ak_unlocked')) || [];
    let selectedFilm = null;

    function renderFilms() {
        const list = document.getElementById('filmList');
        list.innerHTML = '';
        films.forEach(film => {
            const isUnlocked = unlocked.includes(film.id);
            list.innerHTML += `
                <div class="film-card">
                    <img src="${film.poster}" alt="${film.title}">
                    <div class="film-info">
                        <div class="film-title">${film.title}</div>
                        <div class="film-desc">${film.desc}</div>
                        <div class="price-tag">Ticket: Rs. ${film.price}</div>
                        ${isUnlocked 
                            ? `<button class="watch-btn" onclick="watchFilm(${film.id})">▶️ Watch Now</button>` 
                            : `<button class="buy-btn" onclick="openPay(${film.id})">🎟️ Buy Ticket (eSewa)</button>`}
                    </div>
                </div>
            `;
        });
    }

    function openAdmin() {
        const pass = prompt("Enter Admin Password:");
        if (pass === "ankit123") {
            document.getElementById('adminModal').style.display = 'flex';
        } else if (pass !== null) {
            alert("Wrong Password!");
        }
    }

    function saveFilm() {
        const title = document.getElementById('filmTitle').value;
        const poster = document.getElementById('filmPoster').value || "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500";
        const price = document.getElementById('filmPrice').value;
        const video = document.getElementById('filmVideo').value;
        const desc = document.getElementById('filmDesc').value;

        if (!title || !price || !video) {
            alert("Film Name, Ticket Price, ra Video Link compulsory ho!");
            return;
        }
        films.push({ id: Date.now(), title, poster, price, video, desc });
        localStorage.setItem('ak_films', JSON.stringify(films));
        closeModal('adminModal');
        renderFilms();
    }

    function openPay(id) {
        selectedFilm = films.find(f => f.id === id);
        document.getElementById('payFilmName').innerText = "Film: " + selectedFilm.title;
        document.getElementById('payAmount').innerText = "Amount: Rs. " + selectedFilm.price;
        document.getElementById('payModal').style.display = 'flex';
    }

    function confirmPayment() {
        const code = document.getElementById('txnCode').value.trim();
        if (code.length < 5) {
            alert("Valid eSewa Transaction Code halnus!");
            return;
        }
        unlocked.push(selectedFilm.id);
        localStorage.setItem('ak_unlocked', JSON.stringify(unlocked));
        closeModal('payModal');
        renderFilms();
        watchFilm(selectedFilm.id);
    }

    function watchFilm(id) {
        const film = films.find(f => f.id === id);
        document.getElementById('watchTitle').innerText = film.title;
        document.getElementById('videoContainer').innerHTML = `<iframe height="360" src="${film.video}" frameborder="0" allowfullscreen></iframe>`;
        document.getElementById('watchModal').style.display = 'flex';
    }

    function closeVideo() {
        document.getElementById('videoContainer').innerHTML = '';
        closeModal('watchModal');
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    renderFilms();
</script>
</body>
</html>
